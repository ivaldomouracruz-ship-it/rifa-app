{% extends "base.html" %}
{% block titulo %}Entrar — Rifa Online{% endblock %}
{% block conteudo %}
<div class="pagina-central">
    <form class="cartao-form" method="post">
        <h1>Área do organizador</h1>
        {% if erro %}<p class="erro-form">{{ erro }}</p>{% endif %}
        <label>Senha
            <input type="password" name="senha" required autofocus>
        </label>
        <button type="submit" class="botao-primario">Entrar</button>
    </form>
</div>
{% endblock %}
